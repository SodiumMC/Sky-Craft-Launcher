<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SCL DMG 背景调整</title>
<style>
  :root{--bg:#eef2f7;--card:#fff;--line:#e3e7ee;--text:#141a24;--muted:#7b8494;--accent:#0067c0}
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:1120px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:680px 1fr;gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 16px 40px rgba(20,30,50,.08)}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  canvas{width:660px;height:400px;border-radius:8px;display:block;cursor:grab;background:#fff}
  canvas:active{cursor:grabbing}
  .row{display:flex;align-items:center;gap:10px;margin-top:12px}
  .row label{width:64px;color:var(--muted);font-size:12px}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .val{width:56px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
  button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .hint{color:var(--muted);font-size:11px;margin-top:10px;line-height:1.7}
  .drop{border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin-bottom:12px}
  .drop.hover{border-color:var(--accent);color:var(--accent)}
  kbd{background:#f2f4f8;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>DMG 背景调整</h1>
    <div class="sub">660×400 预览（Retina 导出 1320×800）· 拖动图片平移，滚轮/滑杆缩放</div>
    <div class="drop" id="drop">把背景图片拖到这里，或 <label style="color:var(--accent);cursor:pointer">选择文件<input id="file" type="file" accept="image/*" hidden></label></div>
    <canvas id="cv" width="660" height="400"></canvas>
    <div class="row"><label>缩放</label><input id="scale" type="range" min="10" max="400" value="100"/><span class="val" id="scaleVal">100%</span></div>
    <div class="row"><label>水平</label><input id="x" type="range" min="-400" max="400" value="0"/><span class="val" id="xVal">0</span></div>
    <div class="row"><label>垂直</label><input id="y" type="range" min="-300" max="300" value="0"/><span class="val" id="yVal">0</span></div>
    <div class="row" style="justify-content:flex-end">
      <button id="fit">铺满</button>
      <button id="reset">重置</button>
      <button class="primary" id="export">导出 1320×800</button>
    </div>
    <div class="hint">虚线框是 SCL.app / Applications 的位置（96px 图标 + 文字），避免背景文字被挡。<br/>
      导出后放到下载文件夹，告诉我一声，我直接用它打 DMG。</div>
  </div>
  <div class="card">
    <h2 style="font-size:13px;margin:0 0 10px">说明</h2>
    <div class="hint" style="font-size:12px">
      · 图片会以中心为基准缩放<br/>
      · 拖动画布可调整位置<br/>
      · 滚轮缩放，<kbd>Shift</kbd> 加速<br/>
      · 导出固定 2x 分辨率，Finder 在 Retina 上不会放大裁切<br/>
      · 图标位置：SCL (170,205)、Applications (490,205)
    </div>
  </div>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d')
const fileInput = document.getElementById('file'), drop = document.getElementById('drop')
const scaleEl = document.getElementById('scale'), xEl = document.getElementById('x'), yEl = document.getElementById('y')
let img = null, scale = 1, ox = 0, oy = 0, dragging = false, sx = 0, sy = 0, sox = 0, soy = 0

function draw() {
  ctx.clearRect(0, 0, 660, 400)
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 660, 400)
  if (img) {
    const w = img.width * scale, h = img.height * scale
    ctx.drawImage(img, 330 - w / 2 + ox, 200 - h / 2 + oy, w, h)
  }
  // 图标占位
  const boxes = [{ x: 170, y: 205, label: 'SCL.app' }, { x: 490, y: 205, label: 'Applications' }]
  for (const b of boxes) {
    ctx.save()
    ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(0,103,192,.55)'; ctx.lineWidth = 1.5
    ctx.strokeRect(b.x - 48, b.y - 48, 96, 96)
    ctx.restore()
    ctx.fillStyle = 'rgba(20,26,36,.55)'; ctx.font = '12px "PingFang SC", sans-serif'; ctx.textAlign = 'center'
    ctx.fillText(b.label, b.x, b.y + 66)
  }
}
function apply() {
  scale = Number(scaleEl.value) / 100
  ox = Number(xEl.value); oy = Number(yEl.value)
  document.getElementById('scaleVal').textContent = scaleEl.value + '%'
  document.getElementById('xVal').textContent = xEl.value
  document.getElementById('yVal').textContent = yEl.value
  draw()
}
function loadFile(file) {
  const r = new FileReader()
  r.onload = () => { const i = new Image(); i.onload = () => { img = i; fit(); }; i.src = r.result }
  r.readAsDataURL(file)
}
function fit() {
  if (!img) return
  scale = Math.max(660 / img.width, 400 / img.height)
  scaleEl.value = Math.round(scale * 100)
  xEl.value = 0; yEl.value = 0
  apply()
}
fileInput.onchange = (e) => e.target.files[0] && loadFile(e.target.files[0])
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('hover') }
drop.ondragleave = () => drop.classList.remove('hover')
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('hover'); const f = e.dataTransfer.files[0]; if (f) loadFile(f) }
scaleEl.oninput = xEl.oninput = yEl.oninput = apply
document.getElementById('fit').onclick = fit
document.getElementById('reset').onclick = () => { scaleEl.value = 100; xEl.value = 0; yEl.value = 0; apply() }
cv.onmousedown = (e) => { dragging = true; sx = e.clientX; sy = e.clientY; sox = ox; soy = oy }
window.onmousemove = (e) => { if (!dragging) return; xEl.value = sox + (e.clientX - sx); yEl.value = soy + (e.clientY - sy); apply() }
window.onmouseup = () => dragging = false
cv.onwheel = (e) => {
  e.preventDefault()
  const step = e.shiftKey ? 10 : 3
  scaleEl.value = Math.max(10, Math.min(400, Number(scaleEl.value) + (e.deltaY < 0 ? step : -step)))
  apply()
}
document.getElementById('export').onclick = () => {
  if (!img) return alert('先选一张背景图')
  const out = document.createElement('canvas'); out.width = 1320; out.height = 800
  const c = out.getContext('2d')
  c.fillStyle = '#fff'; c.fillRect(0, 0, 1320, 800)
  const w = img.width * scale * 2, h = img.height * scale * 2
  c.drawImage(img, 660 - w / 2 + ox * 2, 400 - h / 2 + oy * 2, w, h)
  const a = document.createElement('a')
  a.download = 'dmg-background-2x.png'
  a.href = out.toDataURL('image/png')
  a.click()
}
draw()
</script>
</body>
</html>
